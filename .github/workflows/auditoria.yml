name: Auditoría de seguridad

# Revisa cada día que las dependencias del sitio no tengan
# vulnerabilidades conocidas de nivel alto o crítico.
on:
  schedule:
    - cron: "23 6 * * *" # todos los días ~6:23 AM
  workflow_dispatch: {}

jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm ci
      - name: Auditar vulnerabilidades (alto y crítico)
        run: npm audit --audit-level=high

      - name: Avisar por WhatsApp si hay vulnerabilidades
        if: failure()
        env:
          PHONE: ${{ secrets.WHATSAPP_PHONE }}
          APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$APIKEY" ] || [ -z "$PHONE" ]; then
            echo "Sin secretos de WhatsApp configurados; se omite el aviso."; exit 0
          fi
          MSG="🟡 MARK: la auditoría encontró vulnerabilidades en las librerías del sitio. Revisa: $RUN_URL"
          curl -sS -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$PHONE" \
            --data-urlencode "text=$MSG" \
            --data-urlencode "apikey=$APIKEY" || true
